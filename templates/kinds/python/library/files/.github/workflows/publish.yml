# Publish to the package index when a version tag is pushed.
# Uses trusted publishing (OIDC): no long-lived token is stored anywhere.
# One-time setup: on the package index, register this repository, workflow file and
# the `release` environment as a trusted publisher. Pin each action by full commit
# hash (see the ci-cd skill); replace the placeholders.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<full-sha>   # v<version>
      - uses: astral-sh/setup-uv@<full-sha>   # v<version>
      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - run: uv sync --locked
      - run: uv run ruff check . && uv run pyright && uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@<full-sha>   # v<version>
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # the only permission this job needs, for trusted publishing
    steps:
      - uses: actions/download-artifact@<full-sha>   # v<version>
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@<full-sha>   # v<version>
      - run: uv publish --trusted-publishing always
