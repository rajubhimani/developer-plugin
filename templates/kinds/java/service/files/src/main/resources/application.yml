# Every value that differs per environment is an environment variable with a default, so a
# cluster supplies the same names from a ConfigMap and a Secret (see the kubernetes skill).
server:
  port: ${APP_PORT:8080}
  shutdown: graceful          # stop accepting, finish in-flight requests, then exit

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${APP_SHUTDOWN_TIMEOUT:20s}   # shorter than the pod grace period
  mvc:
    problemdetails:
      enabled: true           # errors use the standard problem-details format

management:
  endpoints:
    web:
      exposure:
        include: health       # expose nothing else
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /actuator/health/readiness
